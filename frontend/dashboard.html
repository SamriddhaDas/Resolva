<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dashboard · Resolva</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/app.css"/>
<script>
  tailwind.config = { theme: { extend: { colors: { ink:{950:'#0b1220',900:'#0f172a',800:'#1e293b'}, brand:{300:'#67e8f9',500:'#06b6d4',600:'#0891b2',700:'#0e7490'}, accent:{500:'#8b5cf6',600:'#7c3aed'} }, fontFamily:{display:['Space Grotesk'],sans:['Inter']}, boxShadow:{glow:'0 10px 40px -10px rgba(6,182,212,.55)'} } } }
</script>
</head>
<body class="min-h-screen bg-ink-950 text-slate-100 font-sans antialiased">

<header class="sticky top-0 z-30 backdrop-blur bg-ink-950/80 border-b border-white/5">
  <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
    <a href="/" class="font-display text-lg font-semibold flex items-center gap-2">
      <span class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-500 to-accent-500 grid place-items-center">▲</span>
      Resolva
    </a>
    <div class="flex items-center gap-3 text-sm">
      <span id="userBadge" class="hidden sm:inline text-slate-400"></span>
      <button id="logoutBtn" class="px-3 py-1.5 rounded-lg border border-white/10 hover:bg-white/5">Sign out</button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-6 py-10">
  <div class="flex items-end justify-between flex-wrap gap-4">
    <div>
      <h1 class="font-display text-3xl font-semibold tracking-tight">Hi <span id="firstName">there</span>, here's what's open.</h1>
      <p class="text-slate-400 mt-1 text-sm" id="subtitle">Your complaints at a glance.</p>
    </div>
    <button id="newBtn" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-brand-500 to-accent-500 font-medium shadow-glow hover:opacity-95">
      + New complaint
    </button>
  </div>

  <!-- stats -->
  <section class="grid grid-cols-2 lg:grid-cols-4 gap-4 mt-8" id="stats"></section>

  <!-- list -->
  <section class="mt-10">
    <div class="flex items-center justify-between mb-4">
      <h2 class="font-display text-xl font-semibold">Complaints</h2>
      <div class="flex gap-1 text-xs" id="filters">
        <button data-f="all"        class="filter-btn px-3 py-1.5 rounded-md bg-white/10">All</button>
        <button data-f="pending"     class="filter-btn px-3 py-1.5 rounded-md hover:bg-white/5">Pending</button>
        <button data-f="in_progress" class="filter-btn px-3 py-1.5 rounded-md hover:bg-white/5">In progress</button>
        <button data-f="resolved"    class="filter-btn px-3 py-1.5 rounded-md hover:bg-white/5">Resolved</button>
      </div>
    </div>
    <div id="list" class="space-y-3"></div>
    <div id="empty" class="hidden py-16 text-center border border-dashed border-white/10 rounded-2xl">
      <p class="text-4xl">📭</p>
      <p class="mt-3 text-slate-400">No complaints yet. Hit “New complaint” to file one.</p>
    </div>
  </section>
</main>

<!-- new complaint modal -->
<div id="modal" class="hidden fixed inset-0 z-50 bg-ink-950/80 backdrop-blur grid place-items-center p-4">
  <div class="w-full max-w-lg rounded-2xl bg-ink-900 border border-white/10 shadow-2xl">
    <div class="p-6 border-b border-white/10 flex items-center justify-between">
      <h3 class="font-display text-xl font-semibold">File a complaint</h3>
      <button class="closeModal text-slate-400 hover:text-white">✕</button>
    </div>
    <form id="cForm" class="p-6 space-y-4">
      <div>
        <label class="text-xs text-slate-400">Title</label>
        <input name="title" required minlength="3" class="mt-1 w-full px-3.5 py-2.5 rounded-lg bg-ink-800 border border-white/10 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 outline-none"/>
      </div>
      <div>
        <label class="text-xs text-slate-400">Category</label>
        <select name="category" class="mt-1 w-full px-3.5 py-2.5 rounded-lg bg-ink-800 border border-white/10 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 outline-none">
          <option>Infrastructure</option>
          <option>Service</option>
          <option>Billing</option>
          <option>Safety</option>
          <option>Other</option>
        </select>
      </div>
      <div>
        <label class="text-xs text-slate-400">Description</label>
        <textarea name="description" rows="5" required minlength="10"
          placeholder="Describe what's wrong, where, and how urgent it feels…"
          class="mt-1 w-full px-3.5 py-2.5 rounded-lg bg-ink-800 border border-white/10 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 outline-none resize-none"></textarea>
        <p class="text-xs text-slate-500 mt-1">Tip: words like “urgent”, “hazard”, “injured” will bump priority.</p>
      </div>
      <p id="cmsg" class="text-sm text-rose-400 min-h-[1.25rem]"></p>
      <div class="flex justify-end gap-2">
        <button type="button" class="closeModal px-4 py-2 rounded-lg border border-white/10 hover:bg-white/5">Cancel</button>
        <button class="px-4 py-2 rounded-lg bg-gradient-to-r from-brand-500 to-accent-500 font-medium">Submit</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
