<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sign in · Resolva</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/app.css"/>
</head>
<body class="min-h-screen bg-ink-950 text-slate-100 font-sans antialiased grid lg:grid-cols-2">

<aside class="hidden lg:flex relative overflow-hidden p-12 flex-col justify-between bg-gradient-to-br from-brand-700 via-ink-900 to-accent-600">
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_1px_1px,rgba(255,255,255,0.08)_1px,transparent_0)] [background-size:22px_22px] opacity-40"></div>
  <a href="/" class="relative font-display text-xl font-semibold flex items-center gap-2">
    <span class="w-8 h-8 rounded-lg bg-white/10 grid place-items-center">▲</span> Resolva
  </a>
  <div class="relative">
    <h2 class="font-display text-4xl font-semibold leading-tight">"We cleared a 3-month backlog in two weeks."</h2>
    <p class="mt-4 text-slate-200/80">— Operations team, civic services pilot</p>
  </div>
  <p class="relative text-xs text-slate-300/70">Backed by a native C++ priority engine. Built for clarity.</p>
</aside>

<main class="flex items-center justify-center p-8">
  <div class="w-full max-w-sm">
    <a href="/" class="lg:hidden font-display text-xl font-semibold">Resolva</a>
    <h1 class="mt-8 font-display text-3xl font-semibold tracking-tight">Welcome back</h1>
    <p class="mt-2 text-sm text-slate-400">Sign in to manage your complaints.</p>

    <form id="loginForm" class="space-y-4 mt-8">
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5">Email</label>
        <input name="email" type="email" required autocomplete="email"
               class="w-full px-3.5 py-2.5 rounded-lg bg-ink-900 border border-white/10 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 outline-none transition" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5">Password</label>
        <input name="password" type="password" required autocomplete="current-password"
               class="w-full px-3.5 py-2.5 rounded-lg bg-ink-900 border border-white/10 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 outline-none transition" />
      </div>
      <button class="w-full mt-2 py-2.5 rounded-lg bg-gradient-to-r from-brand-500 to-accent-500 font-medium hover:opacity-95 transition shadow-glow">
        Sign in
      </button>
      <p id="msg" class="text-sm text-rose-400 min-h-[1.25rem]"></p>
    </form>

    <p class="mt-8 text-sm text-slate-400">
      No account yet? <a href="/register.html" class="text-brand-300 hover:text-brand-100 font-medium">Create one</a>
    </p>
  </div>
</main>

<script>
  tailwind.config = { theme: { extend: { colors: { ink:{950:'#0b1220',900:'#0f172a',800:'#1e293b'}, brand:{300:'#67e8f9',500:'#06b6d4',600:'#0891b2',700:'#0e7490'}, accent:{500:'#8b5cf6',600:'#7c3aed'} }, fontFamily:{display:['Space Grotesk'], sans:['Inter']}, boxShadow:{glow:'0 10px 40px -10px rgba(6,182,212,.55)'} } } }
</script>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const msg = document.getElementById('msg');
    msg.textContent = '';
    try {
      const r = await api.post('/api/login', { email: fd.get('email'), password: fd.get('password') });
      auth.set(r.token, r.user);
      location.href = '/dashboard.html';
    } catch (err) { msg.textContent = err.message; }
  });
</script>
</body>
</html>
